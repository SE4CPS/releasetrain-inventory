[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "releasetrain-inventory"
version = "0.1.0"
description = "Cross-platform scanner for installed software (not OS/library packages) and their versions, with optional upload to a ReleaseTrain account."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "SE4CPS" }]
keywords = ["inventory", "software", "versions", "releasetrain", "cli", "sysadmin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/SE4CPS/releasetrain-inventory"
Issues = "https://github.com/SE4CPS/releasetrain-inventory/issues"

[project.scripts]
releasetrain-inventory = "releasetrain_inventory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
